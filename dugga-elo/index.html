<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#72c1ec">
  <meta name="description" content="BiKL Sharodotsav — a family Durga Puja photo album with a companion YouTube playlist.">
  <title>BiKL Sharodotsav</title>
  <link rel="icon" href="resources/cd-art.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700&amp;family=Nunito:wght@900&amp;family=Tiro+Bangla:ital@0;1&amp;display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');</script>
  <style>
    :root {
      color-scheme: light;
      /* Album tuning */
      --album-leaf-color: #f3e3c4;
      --portrait-closure-display: none;
      --sky: #72c1ec;
      --paper: #fff9ed;
      --paper-deep: #ead9bb;
      --vermilion: #a33428;
      --deep-red: #6e211c;
      --gold: #b48a4d;
      --charcoal: #2c2622;
      --muted: #77675b;
      --page-width: 320px;
      --page-height: 400px;
      --page-count: 1;
      --book-width: var(--page-width);
      --ridge-width: 0px;
      --ridge-half-width: 0px;
      --cover-reveal: 10px;
      --closure-overhang: 8px;
      --stack-depth: 4px;
      --shell-width: calc(var(--book-width) + ((var(--cover-reveal) + var(--closure-overhang)) * 2));
      --shell-height: calc(var(--page-height) + (var(--cover-reveal) * 2) + var(--stack-depth));
      --header-height: clamp(112px, 16svh, 158px);
      --player-height: 144px;
      font-family: "Lato", Calibri, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    body {
      margin: 0;
      color: var(--charcoal);
      background: var(--sky);
    }

    button,
    input,
    a { font: inherit; }

    button,
    input[type="range"] { touch-action: manipulation; }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible,
    .album-shell:focus-visible {
      outline: 3px solid #f4c972;
      outline-offset: 3px;
    }

    .app {
      position: relative;
      display: grid;
      grid-template-rows: var(--header-height) minmax(0, 1fr) var(--player-height);
      width: 100%;
      height: 100svh;
      min-width: 0;
      min-height: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow: hidden;
      isolation: isolate;
    }

    @supports (height: 100dvh) {
      .app { height: 100dvh; }
    }

    .scenery {
      position: absolute;
      z-index: -1;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 9%, rgba(255, 239, 176, .5) 0, rgba(255, 241, 189, .2) 10%, transparent 25%),
        linear-gradient(180deg, #62b9ee 0%, #8fcfee 43%, #d8f1fa 72%, #cae8d3 100%);
      pointer-events: none;
      user-select: none;
    }

    .scenery-definitions {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .scenery-horizon {
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: calc(100% + 2px);
      height: clamp(210px, 36svh, 390px);
    }

    .scenery-cloud {
      position: absolute;
      display: block;
      height: auto;
      overflow: visible;
      opacity: .8;
      filter: drop-shadow(0 10px 14px rgba(39, 113, 157, .09));
    }

    .scenery-cloud-1 { top: 7%; left: -3%; width: clamp(180px, 24vw, 370px); --cloud-duration: 75s; --cloud-delay: -31s; }
    .scenery-cloud-2 { top: 19%; right: -4%; width: clamp(170px, 22vw, 340px); --cloud-duration: 92s; --cloud-delay: -67s; }
    .scenery-cloud-3 { top: 29%; left: 7%; width: clamp(135px, 17vw, 270px); --cloud-duration: 110s; --cloud-delay: -89s; opacity: .68; }
    .scenery-cloud-4 { top: 5%; right: 12%; width: clamp(130px, 18vw, 285px); --cloud-duration: 128s; --cloud-delay: -112s; opacity: .72; }
    .scenery-cloud-5 { top: 31%; left: 58%; width: clamp(120px, 15vw, 245px); --cloud-duration: 150s; --cloud-delay: -143s; opacity: .58; }

    .kash-cluster {
      position: absolute;
      bottom: -2.5%;
      display: block;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 5px 5px rgba(19, 67, 36, .12));
      transform-origin: 50% 100%;
    }

    .kash-cluster-1 { left: -4%; width: clamp(190px, 25vw, 390px); --kash-duration: 7.2s; --kash-delay: -3.8s; --sway-from: -1.4deg; --sway-to: 1.1deg; }
    .kash-cluster-2 { bottom: -5%; left: 14%; width: clamp(125px, 16vw, 250px); --kash-duration: 8.8s; --kash-delay: -6.2s; --sway-from: -.8deg; --sway-to: 1.3deg; }
    .kash-cluster-3 { right: 13%; width: clamp(130px, 17vw, 265px); --kash-duration: 6.4s; --kash-delay: -2.1s; --sway-from: -1.1deg; --sway-to: 1.8deg; }
    .kash-cluster-4 { right: -4%; width: clamp(190px, 25vw, 390px); --kash-duration: 8.1s; --kash-delay: -5.4s; --sway-from: -1.6deg; --sway-to: .9deg; }

    @keyframes scenery-cloud-drift {
      from { transform: translate3d(-3vw, 0, 0); }
      to { transform: translate3d(7vw, 0, 0); }
    }

    @keyframes scenery-kash-sway {
      from { transform: rotate(var(--sway-from)); }
      to { transform: rotate(var(--sway-to)); }
    }

    @supports ((transform: translate3d(0, 0, 0)) and (animation: scenery-cloud-drift 1s linear)) {
      .scenery-cloud {
        animation: scenery-cloud-drift var(--cloud-duration) linear var(--cloud-delay) infinite;
        will-change: transform;
      }

      .kash-cluster {
        animation: scenery-kash-sway var(--kash-duration) ease-in-out var(--kash-delay) infinite alternate;
        will-change: transform;
      }

      .scenery.is-paused .scenery-cloud,
      .scenery.is-paused .kash-cluster { animation-play-state: paused; }
    }

    .site-header {
      position: relative;
      display: grid;
      place-content: center;
      min-width: 0;
      padding: 8px 18px 4px;
      color: var(--deep-red);
      text-align: center;
      background: transparent;
    }

    .affiliate-links {
      position: absolute;
      z-index: 10;
      top: 8px;
      right: clamp(8px, 1.5vw, 18px);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .affiliate-link {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      background: rgba(255, 249, 237, .78);
      border: 1px solid rgba(110, 33, 28, .24);
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(79, 48, 29, .16), inset 0 1px rgba(255, 255, 255, .7);
    }

    .affiliate-link:hover {
      background: rgba(255, 249, 237, .96);
      border-color: rgba(110, 33, 28, .48);
    }

    .affiliate-link img {
      display: block;
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .affiliate-link-bikl img {
      width: 26px;
      height: 26px;
    }

    .affiliate-link-x img {
      width: 19px;
      height: 19px;
    }

    h1 {
      display: grid;
      justify-items: center;
      gap: clamp(1px, .4svh, 4px);
      margin: 0;
      transform: translateY(var(--site-title-offset, 0));
      text-shadow:
        0 1px 0 #fff9ed,
        0 3px 0 rgba(180, 138, 77, .72),
        0 7px 13px rgba(79, 48, 29, .24);
    }

    .site-title-brand,
    .site-title-bengali {
      display: block;
      white-space: nowrap;
    }

    .site-title-brand {
      font-family: "Nunito", "Arial Rounded MT Std", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
      font-size: var(--site-title-brand-size, clamp(3.2rem, calc(4.4vw + .95rem), 5rem));
      font-weight: 900;
      line-height: .78;
      letter-spacing: .015em;
    }

    .site-title-bengali {
      font-family: "Tiro Bangla", "Noto Serif Bengali", Georgia, serif;
      font-size: var(--site-title-bengali-size, clamp(2rem, calc(2.6vw + .65rem), 3.1rem));
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .album-workspace {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      padding: 2px clamp(4px, .7vw, 10px);
      overflow: hidden;
    }

    .album-shell {
      position: relative;
      width: var(--shell-width, var(--book-width, var(--page-width)));
      height: var(--shell-height, var(--page-height));
      min-width: 0;
      min-height: 0;
      outline: none;
      perspective: 1800px;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .album-cover {
      position: absolute;
      z-index: 0;
      top: 0;
      left: var(--closure-overhang, 10px);
      width: calc(var(--book-width) + (var(--cover-reveal, 12px) * 2));
      height: calc(var(--page-height) + (var(--cover-reveal, 12px) * 2) + var(--stack-depth, 5px));
      pointer-events: none;
    }

    .cover-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: calc(50% - var(--ridge-half-width, 0px));
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% -8%, rgba(255, 216, 166, .18), transparent 48%),
        radial-gradient(circle at 17% 21%, rgba(255, 231, 194, .09) 0 1px, transparent 1.7px),
        radial-gradient(circle at 76% 66%, rgba(24, 5, 5, .2) 0 1px, transparent 1.8px),
        repeating-linear-gradient(116deg, transparent 0 5px, rgba(35, 8, 7, .075) 6px, transparent 8px 13px),
        linear-gradient(100deg, #4a0e0d, #7a201b 7%, #912d24 48%, #6b1715 91%, #3e0b0b);
      border: 1px solid #39100e;
      border-radius: clamp(10px, 1.8vmin, 18px);
      box-shadow:
        0 18px 28px rgba(52, 27, 19, .34),
        0 5px 7px rgba(52, 27, 19, .32),
        inset 0 1px 1px rgba(255, 224, 186, .34),
        inset 0 0 0 3px rgba(39, 7, 7, .2),
        inset 0 -12px 22px rgba(38, 6, 7, .23);
    }

    .cover-panel-left { left: 0; }
    .cover-panel-right { right: 0; }

    .presentation-single .cover-panel-left { width: 100%; }
    .presentation-single .cover-panel-right { display: none; }

    .cover-panel::before {
      position: absolute;
      inset: 7px;
      border: 1px dashed rgba(224, 174, 103, .56);
      border-radius: calc(clamp(10px, 1.8vmin, 18px) - 5px);
      box-shadow: 0 0 0 1px rgba(41, 8, 7, .55), inset 0 0 0 1px rgba(255, 220, 165, .08);
      content: "";
    }

    .cover-panel::after {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(28, 5, 5, .42), transparent 6% 94%, rgba(28, 5, 5, .46)),
        linear-gradient(rgba(255, 230, 190, .08), transparent 8% 90%, rgba(28, 5, 5, .3));
      content: "";
    }

    .page-stack {
      position: absolute;
      z-index: 1;
      top: calc(var(--cover-reveal, 12px) + 2px);
      left: calc(var(--closure-overhang, 10px) + var(--cover-reveal, 12px) + 3px);
      width: var(--book-width);
      height: calc(var(--page-height) + var(--stack-depth, 5px));
      background:
        repeating-linear-gradient(to bottom, rgba(113, 84, 50, .42) 0 1px, transparent 1px 3px),
        linear-gradient(90deg, #d9c49d, #f5e7c9 8%, #e3cda8 96%, #c0a77d);
      border: 1px solid rgba(94, 67, 39, .4);
      border-radius: 3px 5px 7px 3px;
      box-shadow: 3px 4px 5px rgba(45, 25, 18, .28), 7px 7px 11px rgba(45, 25, 18, .14);
      pointer-events: none;
    }

    .presentation-spread .page-stack {
      -webkit-mask-image: linear-gradient(
        to right,
        #000 0,
        #000 calc(50% - 3px - var(--ridge-half-width)),
        transparent calc(50% - 3px - var(--ridge-half-width)),
        transparent calc(50% - 3px + var(--ridge-half-width)),
        #000 calc(50% - 3px + var(--ridge-half-width)),
        #000 100%
      );
      mask-image: linear-gradient(
        to right,
        #000 0,
        #000 calc(50% - 3px - var(--ridge-half-width)),
        transparent calc(50% - 3px - var(--ridge-half-width)),
        transparent calc(50% - 3px + var(--ridge-half-width)),
        #000 calc(50% - 3px + var(--ridge-half-width)),
        #000 100%
      );
    }

    .album-book {
      position: absolute;
      z-index: 2;
      top: var(--cover-reveal, 12px);
      left: calc(var(--closure-overhang, 10px) + var(--cover-reveal, 12px));
      display: grid;
      grid-template-columns: repeat(var(--page-count, 1), var(--page-width));
      column-gap: var(--ridge-width, 0px);
      width: var(--book-width);
      height: var(--page-height);
      filter: drop-shadow(0 8px 8px rgba(55, 31, 21, .2));
      transform-style: preserve-3d;
    }

    .album-book::before {
      position: absolute;
      z-index: 0;
      top: 0;
      bottom: 0;
      left: 50%;
      width: var(--ridge-width, 0px);
      background:
        linear-gradient(90deg, rgba(28, 5, 5, .48), transparent 18% 82%, rgba(28, 5, 5, .5)),
        linear-gradient(90deg, #4a0e0d, #7a201b 22%, #8c2922 50%, #681613 80%, #3e0b0b);
      box-shadow:
        inset 1px 0 rgba(255, 218, 169, .2),
        inset -1px 0 rgba(31, 6, 6, .5),
        inset 0 0 7px rgba(30, 5, 5, .3);
      border-top: 1px solid #39100e;
      border-bottom: 1px solid #39100e;
      content: "";
      pointer-events: none;
      transform: translateX(-50%);
    }

    .page {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      padding: 6px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(180, 138, 77, .065) 0 1px, transparent 1.5px),
        repeating-linear-gradient(110deg, rgba(44, 38, 34, .018) 0 1px, transparent 1px 5px),
        var(--album-leaf-color);
      border: 1px solid rgba(125, 94, 55, .3);
      box-shadow: inset 0 0 24px rgba(180, 138, 77, .09);
      transform-style: preserve-3d;
    }

    .page-left { border-radius: 5px 2px 2px 5px; }
    .page-right { border-radius: 2px 5px 5px 2px; }

    .presentation-spread .page-left {
      box-shadow: inset -7px 0 13px rgba(78, 48, 31, .08), inset 0 0 24px rgba(180, 138, 77, .09);
    }

    .presentation-spread .page-right {
      box-shadow: inset 7px 0 13px rgba(78, 48, 31, .08), inset 0 0 24px rgba(180, 138, 77, .09);
    }

    .presentation-single .page-left { display: none; }

    .presentation-single .page-right {
      border-radius: 5px;
      box-shadow: inset 9px 0 18px rgba(78, 48, 31, .08);
    }

    .photo-frame {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: var(--photo-aspect, auto);
      min-width: 0;
      min-height: 0;
      padding: clamp(5px, .75vmin, 8px);
      overflow: hidden;
      background: #fffaf0;
      border: 1px solid rgba(91, 67, 44, .38);
      box-shadow:
        0 2px 2px rgba(49, 33, 22, .17),
        0 6px 10px rgba(49, 33, 22, .12),
        inset 0 0 0 1px rgba(255, 255, 255, .8);
    }

    .photo-frame.fit-height { width: auto; height: 100%; }
    .photo-frame.fit-width { width: 100%; height: auto; }

    .photo-frame img {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: contain;
      background: #eee2cd;
      -webkit-user-drag: none;
    }

    .photo-frame.is-blank,
    .photo-frame.is-error,
    .photo-frame.is-empty {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      background:
        linear-gradient(135deg, transparent 49%, rgba(180, 138, 77, .11) 49.5% 50.5%, transparent 51%),
        var(--album-leaf-color);
    }

    .photo-frame.is-blank::after,
    .photo-frame.is-error::after,
    .photo-frame.is-empty::after {
      position: static;
      width: auto;
      height: auto;
      max-width: 19ch;
      border: 0;
      color: var(--muted);
      font-family: "Tiro Bangla", Georgia, serif;
      font-size: clamp(.75rem, 1.5vmin, .92rem);
      line-height: 1.35;
      text-align: center;
    }

    .photo-frame.is-blank::after { content: "More memories, on another page."; }
    .photo-frame.is-error::after { content: "This photograph could not be opened."; }
    .photo-frame.is-empty::after { content: "No photographs are available for this album."; }
    .photo-frame.is-blank::before,
    .photo-frame.is-error::before,
    .photo-frame.is-empty::before { display: none; }
    .photo-frame.is-blank img,
    .photo-frame.is-error img,
    .photo-frame.is-empty img { display: none; }

    .binding {
      position: absolute;
      z-index: 12;
      top: 3%;
      left: 50%;
      width: 24px;
      height: 94%;
      pointer-events: none;
      transform: translateX(-50%);
    }

    .presentation-single .binding { left: 0; }

    .binding::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 5px;
      background: linear-gradient(90deg, #312a25, #aa8350 46%, #3a3029 55%, #171412);
      border-radius: 4px;
      box-shadow: 0 0 4px rgba(0,0,0,.35);
      content: "";
      transform: translateX(-50%);
    }

    .coil {
      position: absolute;
      left: 1px;
      width: 22px;
      height: 9px;
      border: 3px solid #3d332b;
      border-top-color: #c49a60;
      border-radius: 50%;
      box-shadow: 0 2px 2px rgba(0,0,0,.28);
      transform: translateY(-50%);
    }

    .turn-leaf {
      position: absolute;
      z-index: 10;
      top: 0;
      width: var(--page-width);
      height: var(--page-height);
      backface-visibility: hidden;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      pointer-events: none;
    }

    .turn-leaf.forward { right: 0; transform-origin: calc(0px - var(--ridge-half-width, 0px)) center; }
    .turn-leaf.backward { left: 0; transform-origin: calc(100% + var(--ridge-half-width, 0px)) center; }
    .presentation-single .turn-leaf { right: 0; left: 0; }

    .album-nav {
      position: absolute;
      z-index: 30;
      top: 50%;
      display: grid;
      place-items: center;
      width: 56px;
      height: 64px;
      padding: 0;
      color: #4a2815;
      background:
        repeating-linear-gradient(115deg, transparent 0 6px, rgba(35, 7, 7, .12) 7px, transparent 9px 14px),
        linear-gradient(#8c2c25, #571310);
      border: 1px solid #3c0b0a;
      box-shadow: 0 5px 9px rgba(45, 24, 17, .32), inset 0 1px rgba(255, 223, 183, .18);
      cursor: pointer;
      font-size: 0;
      transform: translateY(-50%);
    }

    .album-nav::before {
      position: absolute;
      top: 50%;
      width: 40px;
      height: 40px;
      background:
        radial-gradient(circle, #6c451f 0 12%, #d8b36d 14% 24%, #8c602c 27% 42%, transparent 44%),
        radial-gradient(circle at 35% 28%, #f5daa0, #bd8b43 35%, #7b4d20 72%, #d3a65e 78%, #684019 100%);
      border: 1px solid #5c3918;
      border-radius: 50%;
      box-shadow: 0 3px 4px rgba(34, 17, 10, .42), inset 1px 1px rgba(255, 239, 191, .72), inset -2px -2px 3px rgba(73, 40, 13, .42);
      content: "";
      transform: translateY(-50%);
    }

    .album-nav::after {
      position: absolute;
      z-index: 1;
      top: 50%;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      font-family: Georgia, serif;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 1px rgba(255, 232, 179, .7), 0 -1px rgba(66, 35, 14, .55);
      transform: translateY(-50%);
    }

    .album-nav:hover:not(:disabled) {
      color: #2d160c;
      background:
        repeating-linear-gradient(115deg, transparent 0 6px, rgba(35, 7, 7, .1) 7px, transparent 9px 14px),
        linear-gradient(#a43a30, #671713);
    }
    .album-nav:disabled { cursor: default; opacity: .42; }
    .album-nav.previous {
      left: 0;
      justify-items: start;
      padding-left: 15px;
      border-radius: 5px 24px 24px 5px;
    }
    .album-nav.previous::before { left: 2px; }
    .album-nav.previous::after { left: 2px; content: "\276E"; }
    .album-nav.next {
      right: 0;
      justify-items: end;
      padding-right: 15px;
      border-radius: 24px 5px 5px 24px;
    }
    .album-nav.next::before { right: 2px; }
    .album-nav.next::after { right: 2px; content: "\276F"; }

    html.show-yt-iframe { --player-height: 216px; }

    .compact-player {
      display: none;
      min-width: 0;
      min-height: 0;
    }

    .player {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 8px max(10px, 1.5vw);
      color: #fff7e8;
      background: transparent;
      overflow: hidden;
    }

    .mini-player {
      position: absolute;
      bottom: 12px;
      left: 50%;
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      width: clamp(480px, 52vw, 700px);
      min-height: 118px;
      padding: 10px 22px 10px 14px;
      background: linear-gradient(105deg, rgba(62, 45, 35, .82), rgba(110, 33, 28, .86));
      background-clip: padding-box;
      border: 2px solid rgba(255, 249, 237, .32);
      border-radius: 999px;
      box-shadow:
        0 3px 0 rgba(65, 31, 25, .3),
        0 13px 28px rgba(54, 31, 22, .3),
        inset 0 1px rgba(255, 249, 237, .2),
        inset 0 -3px rgba(42, 23, 19, .18);
      -webkit-backdrop-filter: blur(10px) saturate(.88);
      backdrop-filter: blur(10px) saturate(.88);
      transform: translateX(-50%);
    }

    .disc-wrap {
      display: grid;
      place-items: center;
      min-width: 0;
    }

    .disc {
      position: relative;
      display: grid;
      place-items: center;
      width: 72px;
      min-width: 56px;
      aspect-ratio: 1;
      overflow: hidden;
      background: radial-gradient(circle, #b48a4d 0 8%, #f0d69f 9% 15%, #3a2c25 16% 24%, #7e241e 25% 68%, #e9d6b5 69% 71%, #2d2825 72%);
      border-radius: 50%;
      box-shadow: 0 6px 13px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.2);
      animation: disc-spin 7s linear infinite;
      animation-play-state: paused;
    }

    .disc.is-spinning { animation-play-state: running; }
    .disc img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .disc.css-fallback img { display: none; }
    .disc.css-fallback::after {
      color: #fff3d5;
      content: "BiKL";
      font-family: "Lato", Calibri, sans-serif;
      font-size: clamp(.7rem, 1.6vw, 1rem);
      letter-spacing: .08em;
    }

    @keyframes disc-spin { to { transform: rotate(360deg); } }

    .player-console {
      display: grid;
      grid-template-rows: auto auto;
      gap: 9px;
      min-width: 0;
      align-content: center;
    }

    .player-heading {
      min-width: 0;
    }

    .player-heading h2 {
      position: relative;
      margin: 0;
      overflow: hidden;
      color: #fffaf1;
      font-family: "Lato", Calibri, system-ui, sans-serif;
      font-size: clamp(.96rem, 1.45vw, 1.15rem);
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .track-title-text {
      display: inline-block;
      max-width: none;
      transform: translateX(0);
      white-space: nowrap;
    }

    .track-title-text.is-overflowing {
      animation: title-marquee var(--title-marquee-duration, 9s) ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes title-marquee {
      0%, 14% { transform: translateX(0); }
      86%, 100% { transform: translateX(var(--title-offset, 0)); }
    }

    .transport {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 0;
      gap: 9px;
    }

    .control-button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      padding: 0;
      color: #fff8e9;
      background: transparent;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
    }

    .control-button svg,
    .compact-play-pause svg {
      display: block;
      pointer-events: none;
    }

    .pause-icon { display: none !important; }
    .is-playing .play-icon { display: none !important; }
    .is-playing .pause-icon { display: block !important; }

    .control-button.primary {
      width: 60px;
      height: 60px;
      color: #251e1a;
      background: #fffaf1;
      border: 2px solid #251e1a;
      box-shadow: 0 0 0 3px #fffaf1, 0 5px 14px rgba(0, 0, 0, .24);
    }
    .control-button:hover:not(:disabled) { background: rgba(255, 249, 237, .14); }
    .control-button.primary:hover:not(:disabled) { background: #f3dfba; }
    .control-button:disabled { cursor: not-allowed; opacity: .42; }

    .progress-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      min-width: 0;
      gap: 8px;
    }

    progress {
      width: 100%;
      height: 7px;
      overflow: hidden;
      appearance: none;
      background: #4c423b;
      border: 0;
      border-radius: 999px;
    }

    progress::-webkit-progress-bar { background: #4c423b; }
    progress::-webkit-progress-value { background: #fffaf1; }
    progress::-moz-progress-bar { background: #fffaf1; }
    .time-readout { color: rgba(255, 250, 241, .75); font-size: .75rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .youtube-surface {
      position: absolute;
      right: max(10px, env(safe-area-inset-right));
      bottom: 8px;
      box-sizing: content-box;
      display: grid;
      place-items: center;
      width: 200px;
      min-width: 200px;
      height: 200px;
      min-height: 200px;
      overflow: hidden;
      background: #171411;
      border: 1px solid rgba(180, 138, 77, .7);
      box-shadow: 0 5px 14px rgba(0,0,0,.35);
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      opacity: 0;
      pointer-events: none;
    }

    html.show-yt-iframe .youtube-surface {
      clip: auto;
      clip-path: none;
      opacity: 1;
      pointer-events: auto;
    }

    .youtube-host,
    .youtube-host iframe { display: block; width: 200px !important; height: 200px !important; min-width: 200px; min-height: 200px; border: 0; }

    .player-message {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-content: center;
      gap: 8px;
      padding: 18px;
      color: #efe3d0;
      font-size: .85rem;
      line-height: 1.25;
      text-align: center;
      background: #171411;
    }

    .player-message[hidden] { display: none; }
    .player-message a { color: #f0c77e; }

    .noscript-note {
      position: absolute;
      z-index: 30;
      right: 12px;
      bottom: 12px;
      max-width: 30ch;
      padding: 10px 12px;
      color: #fff8e9;
      background: #2c2622;
      border: 1px solid #b48a4d;
      border-radius: 4px;
      font-size: .85rem;
    }

    .noscript-note a { color: #f0c77e; }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @media (min-width: 701px) and (max-width: 900px) {
      html.show-yt-iframe .mini-player {
        left: max(10px, env(safe-area-inset-left));
        width: min(700px, calc(100% - 232px));
        transform: none;
      }
    }

    @media (orientation: portrait) {
      #previousPhoto,
      #nextPhoto { display: var(--portrait-closure-display); }
    }

    @media (max-width: 700px) {
      :root { --player-height: 118px; }
      html.show-yt-iframe { --player-height: 344px; }
      .album-workspace { padding-right: 4px; padding-left: 4px; }
      .mini-player {
        grid-template-columns: 50px minmax(0, 1fr) auto;
        gap: 8px;
        width: calc(100% - 20px);
        min-height: 94px;
        padding: 8px 14px 8px 10px;
      }
      html.show-yt-iframe .mini-player { bottom: 216px; }
      .disc { width: 48px; min-width: 48px; }
      .player-console { gap: 8px; }
      .player-heading h2 { font-size: .86rem; }
      .transport { gap: 3px; }
      .control-button { width: 44px; height: 44px; }
      .control-button.primary { width: 56px; height: 56px; box-shadow: 0 0 0 2px #fffaf1, 0 4px 10px rgba(0, 0, 0, .22); }
      .progress-wrap { gap: 5px; }
      .time-readout { font-size: .62rem; }
    }

    @media (max-width: 500px) {
      .site-header { padding: 38px 12px 4px; }
      .site-title-brand { font-size: var(--site-title-brand-size, 2.75rem); }
      .site-title-bengali { font-size: var(--site-title-bengali-size, 1.7rem); }
      .affiliate-links { top: 6px; right: 8px; gap: 4px; }
      .affiliate-link { width: 30px; height: 30px; }
      .affiliate-link img { width: 20px; height: 20px; }
      .affiliate-link-bikl img { width: 24px; height: 24px; }
      .affiliate-link-x img { width: 18px; height: 18px; }
    }

    @media (orientation: landscape) and (max-width: 900px) and (max-height: 500px) {
      :root { --header-height: clamp(58px, 18svh, 70px); }

      .app {
        grid-template-rows: var(--header-height) minmax(0, 1fr);
      }

      .site-header { padding: 4px 12px 2px; }

      h1 {
        gap: 0;
        text-shadow:
          0 1px 0 #fff9ed,
          0 2px 0 rgba(180, 138, 77, .72),
          0 3px 7px rgba(79, 48, 29, .22);
      }

      .site-title-brand { font-size: clamp(1.2rem, 7svh, 1.55rem); }
      .site-title-bengali { font-size: clamp(.98rem, 5svh, 1.2rem); }

      .content {
        grid-row: 2;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) clamp(90px, 14vw, 122px);
        gap: 0;
        padding: 7px max(7px, env(safe-area-inset-right)) 7px max(7px, env(safe-area-inset-left));
      }

      .album-workspace {
        grid-column: 1 / 3;
        padding: 1px 3px 1px 1px;
      }

      .album-book {
        filter: drop-shadow(0 6px 7px rgba(79, 48, 29, .15));
      }

      .page { padding: 3px; transform-style: flat; }
      .photo-frame { padding: 3px; box-shadow: 0 2px 4px rgba(48, 35, 25, .15); }
      .binding { width: 18px; }
      .coil { left: 1px; width: 16px; height: 7px; border-width: 2px; }

      .player {
        position: fixed;
        top: 0;
        left: 0;
        width: 200px;
        height: 200px;
        padding: 0;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        pointer-events: none;
      }

      .cover-panel::before { inset: 4px; }
      .album-nav { width: 44px; height: 48px; }
      .album-nav::before { width: 30px; height: 30px; }
      .album-nav::after { width: 30px; height: 30px; font-size: .78rem; }
      .album-nav.previous { padding-left: 11px; border-radius: 4px 18px 18px 4px; }
      .album-nav.next { padding-right: 11px; border-radius: 18px 4px 4px 18px; }

      .compact-player {
        display: grid;
        grid-column: 3;
        place-items: center;
        min-width: 0;
        min-height: 0;
        padding: 8px;
      }

      .compact-play-pause {
        width: clamp(64px, 16svh, 78px);
        height: clamp(64px, 16svh, 78px);
        color: #251e1a;
        background: #fffaf1;
        border: 2px solid #251e1a;
        border-radius: 50%;
        box-shadow: 0 0 0 4px #fffaf1, 0 7px 18px rgba(54, 31, 22, .3);
        cursor: pointer;
      }

      .compact-play-pause:hover:not(:disabled) { background: #f3dfba; }
      .compact-play-pause:disabled { cursor: not-allowed; opacity: .42; }

      .photo-frame.is-blank::after,
      .photo-frame.is-error::after { font-size: .68rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
      .scenery-cloud,
      .kash-cluster {
        animation: none !important;
        will-change: auto !important;
      }
      .disc { animation: none; }
      .track-title-text.is-overflowing { animation: none; }
    }

    @media (prefers-contrast: more) {
      .page, .photo-frame, .control-button, .affiliate-link, .youtube-surface { border-width: 2px; }
      .time-readout { color: #fff9ed; }
    }
  </style>
</head>
<body>
  <div class="app" id="app" data-layout="normal">
    <div class="scenery" id="scenery" aria-hidden="true">

      <svg class="scenery-cloud scenery-cloud-3" viewBox="0 0 320 125" focusable="false"><use href="#cloud-form"></use></svg>

          <linearGradient id="far-grass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6f9f45"></stop>
            <stop offset="1" stop-color="#3f793b"></stop>
          </linearGradient>
          <linearGradient id="near-grass" x1="0" y1="0" x2="0" y2="1">

    <header class="site-header">
      <h1 id="siteTitle">

        <span class="site-title-bengali" id="siteTitleBengali" lang="bn">শারদোৎসব</span>

        <a class="affiliate-link affiliate-link-bikl" href="https://bikl.in/" target="_blank" rel="noopener noreferrer" aria-label="Visit the BiKL website">

          <img src="resources/instagram.svg" alt="" width="22" height="22">
        </a>
        <a class="affiliate-link affiliate-link-x" href="https://x.com/djoydip" target="_blank" rel="noopener noreferrer" aria-label="Visit the author on X">
          <img src="resources/x-logo.svg" alt="" width="22" height="22">
        </a>
        <a class="affiliate-link" href="https://www.youtube.com/playlist?list=PLwE4iPKbDie6w4G4GjQ0Mccj49tgjiU4M" target="_blank" rel="noopener noreferrer" aria-label="Open the Puja playlist on YouTube Music">

    <main class="content">

          <div class="album-cover" aria-hidden="true">
            <span class="cover-panel cover-panel-left"></span>
            <span class="cover-panel cover-panel-right"></span>
          </div>
          <div class="page-stack" aria-hidden="true"></div>
          <button class="album-nav previous" id="previousPhoto" type="button" aria-label="Previous album page">&#x276E;</button>
          <div class="album-book" id="albumBook">
            <article class="page page-left" id="leftPage" aria-hidden="true">
              <div class="photo-frame" id="leftFrame"><img id="leftImage" alt="" decoding="async"></div>
            </article>
            <article class="page page-right" id="rightPage">
              <div class="photo-frame fit-width" id="rightFrame" style="--photo-aspect: 1.4995">

      <aside class="compact-player" aria-label="Compact music player">

          <svg class="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"></path></svg>
        </button>
      </aside>
    </main>

    <footer class="player" id="fullPlayer" aria-label="Music player">
      <section class="mini-player" aria-labelledby="playerTitle">
        <div class="disc-wrap" aria-hidden="true">
          <div class="disc" id="disc"><img id="discImage" src="resources/cd-art.png" alt=""></div>
        </div>

        <div class="player-console">
          <div class="player-heading">
            <h2 id="playerTitle"><span class="track-title-text" id="playerTitleText">Puja playlist</span></h2>
          </div>
          <div class="progress-wrap">
            <progress id="progress" max="1" value="0" aria-label="Playback progress"></progress>
            <span class="time-readout" id="timeReadout">0:00 / 0:00</span>
          </div>
        </div>

        <div class="transport" aria-label="Playback controls">
          <button class="control-button" id="previousTrack" type="button" aria-label="Previous track" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path></svg>

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const modulo = (value, divisor) => ((value % divisor) + divisor) % divisor;

      const TITLE_FIT = Object.freeze({
        albumGap: 24,
        shadowExtent: 13,
        topPadding: 12,
        sidePadding: 24,
        minimumScale: 1.35,
        maximumScale: 2.5
      });

      function buildBinding() {
        elements.binding.replaceChildren();
        const count = state.album.presentation === 'compact-spread' ? 9 : 13;
        for (let index = 0; index < count; index += 1) {
          const coil = document.createElement('span');
          coil.className = 'coil';
          coil.style.top = `${(index + .5) * (100 / count)}%`;
          elements.binding.append(coil);
        }
      }

      function normalizedIndex(index, presentation = state.album.presentation) {
        const count = state.album.images.length;
        if (!count) return 0;
        const wrapped = modulo(index, count);
        return presentation === 'single' ? wrapped : wrapped - (wrapped % 2);
      }

      function stepSize() {
        return state.album.presentation === 'single' ? 1 : 2;
      }

      function targetForDirection(direction) {
        const count = state.album.images.length;
        if (count <= 1) return state.album.activeIndex;
        const step = stepSize();
        if (direction > 0) {
          const candidate = state.album.activeIndex + step;
          return candidate >= count ? 0 : normalizedIndex(candidate);
        }
        if (state.album.activeIndex === 0) {
          return state.album.presentation === 'single' ? count - 1 : count - 1 - ((count - 1) % 2);
        }
        return normalizedIndex(state.album.activeIndex - step);
      }

      function clearFrame(frame, image, mode = 'blank') {
        image.removeAttribute('src');
        image.alt = '';
        image.onerror = null;
        delete image.dataset.imageIndex;
        frame.classList.remove('is-error', 'is-blank', 'is-empty', 'fit-width', 'fit-height');
        frame.style.removeProperty('--photo-aspect');
        frame.classList.add(mode === 'error' ? 'is-error' : mode === 'empty' ? 'is-empty' : 'is-blank');
      }

      function populateFrame(frame, image, imageIndex, highPriority = false) {
        frame.classList.remove('is-error', 'is-blank', 'is-empty', 'fit-width', 'fit-height');
        if (imageIndex < 0 || imageIndex >= state.album.images.length) {
          clearFrame(frame, image, 'blank');
          return;
        }

        const item = state.album.images[imageIndex];
        const photoAspect = item.width / item.height;
        const pageAspect = state.album.presentation === 'compact-spread' ? 1.25 : .8;
        frame.style.setProperty('--photo-aspect', String(photoAspect));
        frame.classList.add(photoAspect >= pageAspect ? 'fit-width' : 'fit-height');
        image.hidden = false;
        image.width = item.width;
        image.height = item.height;
        image.alt = item.alt;
        image.decoding = 'async';
        image.fetchPriority = highPriority ? 'high' : 'auto';
        if (image.dataset.imageIndex === String(imageIndex) && image.getAttribute('src')) return;
        image.dataset.imageIndex = String(imageIndex);
        image.dataset.fallbackAttempted = 'false';
        image.onerror = () => {
          if (image.dataset.fallbackAttempted === 'false') {
            image.dataset.fallbackAttempted = 'true';
            image.src = item.fallback;
            return;
          }
          image.onerror = null;
          clearFrame(frame, image, 'error');
        };
        image.src = item.src;
      }

      function visibleIndices(index = state.album.activeIndex) {
        if (!state.album.images.length) return [];
        return state.album.presentation === 'single' ? [index] : [index, index + 1];
      }

      function renderAlbum(highPriority = false) {
        const count = state.album.images.length;
        const single = state.album.presentation === 'single';
        elements.shell.classList.toggle('presentation-single', single);
        elements.shell.classList.toggle('presentation-spread', !single);
        elements.leftPage.setAttribute('aria-hidden', String(single));

        if (!count) {
          clearFrame(elements.leftFrame, elements.leftImage, 'blank');
          clearFrame(elements.rightFrame, elements.rightImage, 'empty');
          elements.shell.setAttribute('aria-label', 'The photo album is empty.');
          elements.previousPhoto.disabled = true;
          elements.nextPhoto.disabled = true;
          return;
        }

        if (single) {
          clearFrame(elements.leftFrame, elements.leftImage, 'blank');
          populateFrame(elements.rightFrame, elements.rightImage, state.album.activeIndex, highPriority);
        } else {
          populateFrame(elements.leftFrame, elements.leftImage, state.album.activeIndex, highPriority);
          populateFrame(elements.rightFrame, elements.rightImage, state.album.activeIndex + 1, highPriority);
        }

        const shown = visibleIndices().filter(index => index < count);
        const label = shown.length === 1
          ? `Photo ${shown[0] + 1} of ${count}: ${state.album.images[shown[0]].alt}`
          : `Photos ${shown[0] + 1} and ${shown[1] + 1} of ${count}`;
        elements.shell.setAttribute('aria-label', `${label}. Use the arrow keys or tap a side to turn pages.`);
        const disabled = count <= 1;
        elements.previousPhoto.disabled = disabled;
        elements.nextPhoto.disabled = disabled;
        preloadAdjacent();
      }

      function preloadImage(index) {
        if (index < 0 || index >= state.album.images.length) return Promise.resolve();
        const item = state.album.images[index];
        return new Promise(resolve => {
          const image = new Image(item.width, item.height);
          image.decoding = 'async';
          image.onload = () => {
            const decoded = image.decode ? image.decode().catch(() => {}) : Promise.resolve();
            decoded.finally(() => {
              image.onload = null;
              image.onerror = null;
              resolve();
            });
          };
          image.onerror = resolve;
          image.src = item.src;
        });
      }

      function preloadAdjacent() {
        if (state.album.images.length <= 1) return;
        const forward = targetForDirection(1);
        const backward = targetForDirection(-1);
        const indices = new Set([...visibleIndices(forward), ...visibleIndices(backward)]);
        for (const index of indices) preloadImage(index);
      }

      function stopSlideshow() {
        if (state.album.slideshowTimer) window.clearTimeout(state.album.slideshowTimer);
        state.album.slideshowTimer = null;
      }

      function restartSlideshow() {
        stopSlideshow();
        if (
          state.album.images.length <= 1 ||
          !state.album.documentVisible ||
          state.album.isHeld ||
          state.album.phase !== 'idle'
        ) return;
        state.album.slideshowTimer = window.setTimeout(() => changeAlbum(1, false), 5000);
      }

      function makeTurnLeaf(direction) {
        const leaf = document.createElement('article');
        leaf.className = `page turn-leaf ${direction > 0 ? 'forward page-right' : 'backward page-left'}`;
        const frame = document.createElement('div');
        frame.className = 'photo-frame';
        const image = document.createElement('img');
        image.alt = '';
        image.decoding = 'async';
        frame.append(image);
        leaf.append(frame);
        const sourceIndex = state.album.presentation === 'single'
          ? state.album.activeIndex
          : direction > 0 ? state.album.activeIndex + 1 : state.album.activeIndex;
        populateFrame(frame, image, sourceIndex);
        return leaf;
      }

      function cleanTurnLayer() {
        if (state.album.animationHandle) {
          try { state.album.animationHandle.cancel(); } catch (error) { /* already finished */ }
        }
        state.album.animationHandle = null;
        elements.book.querySelectorAll('.turn-leaf').forEach(leaf => leaf.remove());
      }

      function commitTurn(target, manual) {
        cleanTurnLayer();
        state.album.activeIndex = normalizedIndex(target);
        state.album.targetIndex = null;
        state.album.phase = 'idle';
        renderAlbum();
        if (manual) {
          const shown = visibleIndices().filter(index => index < state.album.images.length);
          elements.albumAnnouncement.textContent = shown.length === 1
            ? `Showing photo ${shown[0] + 1} of ${state.album.images.length}.`
            : `Showing photos ${shown[0] + 1} and ${shown[1] + 1} of ${state.album.images.length}.`;
        }
        restartSlideshow();
      }

      async function changeAlbum(direction, manual = true) {
        if (state.album.phase !== 'idle' || state.album.images.length <= 1) return;
        stopSlideshow();
        state.album.phase = 'preparing';
        state.album.direction = direction;
        state.album.targetIndex = targetForDirection(direction);
        const target = state.album.targetIndex;
        await Promise.all(visibleIndices(target).map(preloadImage));
        if (state.album.phase !== 'preparing' || state.album.targetIndex !== target) return;

        const leaf = makeTurnLeaf(direction);
        elements.book.append(leaf);
        const reduced = state.layout.reducedMotion;
        const totalDuration = reduced ? 160 : state.album.presentation === 'compact-spread' ? 480 : 680;

        if (reduced || typeof leaf.animate !== 'function') {
          state.album.phase = 'first-half';
          const animation = leaf.animate(
            [{ opacity: 1, transform: 'translateX(0)' }, { opacity: 0, transform: `translateX(${direction * -12}px)` }],
            { duration: totalDuration, easing: 'ease-out', fill: 'forwards' }
          );
          state.album.animationHandle = animation;
          try { await animation.finished; } catch (error) { return; }
          commitTurn(target, manual);
          return;
        }

        const half = totalDuration / 2;
        const midpoint = direction > 0 ? -89.5 : 89.5;
        const endpoint = direction > 0 ? -179.5 : 179.5;
        state.album.phase = 'first-half';
        let animation = leaf.animate(
          [{ transform: 'rotateY(0deg)', filter: 'brightness(1)' }, { transform: `rotateY(${midpoint}deg)`, filter: 'brightness(.82)' }],
          { duration: half, easing: 'cubic-bezier(.45,.02,.68,.53)', fill: 'forwards' }
        );
        state.album.animationHandle = animation;
        try { await animation.finished; } catch (error) { return; }
        if (state.album.targetIndex !== target) return;

        state.album.phase = 'midpoint';
        state.album.activeIndex = normalizedIndex(target);
        renderAlbum();
        state.album.phase = 'second-half';
        animation = leaf.animate(
          [{ transform: `rotateY(${midpoint}deg)`, opacity: .82 }, { transform: `rotateY(${endpoint}deg)`, opacity: 0 }],
          { duration: half, easing: 'cubic-bezier(.32,.47,.25,1)', fill: 'forwards' }
        );
        state.album.animationHandle = animation;
        try { await animation.finished; } catch (error) { return; }
        commitTurn(target, manual);
      }

      function cancelTurnAndSettle() {
        if (state.album.phase === 'idle') return;
        const target = state.album.targetIndex;
        cleanTurnLayer();
        if (Number.isInteger(target)) state.album.activeIndex = normalizedIndex(target);
        state.album.targetIndex = null;
        state.album.phase = 'idle';
      }

      function determinePresentation(bounds) {
        if (state.layout.mode === 'restricted-landscape') return 'compact-spread';
        return bounds.width < 620 ? 'single' : 'spread';
      }

      function resetSiteTitleFit() {
        elements.siteTitle.style.removeProperty('--site-title-brand-size');
        elements.siteTitle.style.removeProperty('--site-title-bengali-size');
        elements.siteTitle.style.removeProperty('--site-title-offset');
      }

      function fitSiteTitle() {
        resetSiteTitleFit();
        if (state.layout.mode !== 'normal') return;

        const appBounds = elements.app.getBoundingClientRect();
        if (appBounds.width <= 500) return;
        const headerBounds = elements.header.getBoundingClientRect();
        const shellBounds = elements.shell.getBoundingClientRect();
        const baseHeight = elements.siteTitle.offsetHeight;
        const baseWidth = elements.siteTitle.offsetWidth;
        if (!baseHeight || !baseWidth || !shellBounds.height) return;

        const availableTop = Math.max(appBounds.top, headerBounds.top) + TITLE_FIT.topPadding;
        const availableBottom = shellBounds.top - TITLE_FIT.albumGap - TITLE_FIT.shadowExtent;
        const availableHeight = availableBottom - availableTop;
        const availableWidth = appBounds.width - (TITLE_FIT.sidePadding * 2);
        const scale = Math.min(
          TITLE_FIT.maximumScale,
          availableHeight / baseHeight,
          availableWidth / baseWidth
        );
        if (scale < TITLE_FIT.minimumScale) return;

        const brandSize = parseFloat(window.getComputedStyle(elements.siteTitleBrand).fontSize);
        const bengaliSize = parseFloat(window.getComputedStyle(elements.siteTitleBengali).fontSize);
        elements.siteTitle.style.setProperty('--site-title-brand-size', `${brandSize * scale}px`);
        elements.siteTitle.style.setProperty('--site-title-bengali-size', `${bengaliSize * scale}px`);

        const grownBounds = elements.siteTitle.getBoundingClientRect();
        const targetCenter = availableTop + (availableHeight / 2);
        const currentCenter = grownBounds.top + (grownBounds.height / 2);
        elements.siteTitle.style.setProperty('--site-title-offset', `${targetCenter - currentCenter}px`);
      }

      function sizeAlbum() {
        const bounds = elements.workspace.getBoundingClientRect();
        if (!bounds.width || !bounds.height) return;
        const workspaceStyle = window.getComputedStyle(elements.workspace);
        const innerWidth = bounds.width - parseFloat(workspaceStyle.paddingLeft) - parseFloat(workspaceStyle.paddingRight);
        const innerHeight = bounds.height - parseFloat(workspaceStyle.paddingTop) - parseFloat(workspaceStyle.paddingBottom);
        const nextPresentation = determinePresentation(bounds);
        const oldPresentation = state.album.presentation;
        if (state.album.phase !== 'idle') cancelTurnAndSettle();
        state.album.presentation = nextPresentation;
        state.album.activeIndex = normalizedIndex(state.album.activeIndex, nextPresentation);

        const compact = nextPresentation === 'compact-spread';
        const pageCount = nextPresentation === 'single' ? 1 : 2;
        const ridgeWidth = pageCount === 1 ? 0 : compact ? 8 : 12;
        const ratio = compact ? 1.25 : .8;
        const coverReveal = compact ? 6 : bounds.width < 620 ? 10 : 12;
        const closuresRendered = [elements.previousPhoto, elements.nextPhoto]
          .some(button => window.getComputedStyle(button).display !== 'none');
        const closureOverhang = closuresRendered ? compact ? 6 : bounds.width < 620 ? 8 : 10 : 0;
        const stackDepth = compact ? 3 : bounds.width < 620 ? 4 : 5;
        const horizontalDecoration = 2 * (coverReveal + closureOverhang);
        const verticalDecoration = (2 * coverReveal) + stackDepth;
        const availableWidth = Math.max(80, innerWidth - horizontalDecoration);
        const availableHeight = Math.max(80, innerHeight - verticalDecoration);
        const maxBookWidth = compact ? availableWidth : Math.min(1180, availableWidth);
        let pageHeight = Math.min(availableHeight, maxBookWidth / (ratio * pageCount));
        let pageWidth = pageHeight * ratio;
        if ((pageWidth * pageCount) > maxBookWidth) {
          pageWidth = maxBookWidth / pageCount;
          pageHeight = pageWidth / ratio;
        }

        pageWidth = Math.floor(pageWidth);
        pageHeight = Math.floor(pageHeight);
        const bookWidth = (pageWidth * pageCount) + ridgeWidth;
        elements.shell.style.setProperty('--page-width', `${pageWidth}px`);
        elements.shell.style.setProperty('--page-height', `${pageHeight}px`);
        elements.shell.style.setProperty('--page-count', pageCount);
        elements.shell.style.setProperty('--book-width', `${bookWidth}px`);
        elements.shell.style.setProperty('--ridge-width', `${ridgeWidth}px`);
        elements.shell.style.setProperty('--ridge-half-width', `${ridgeWidth / 2}px`);
        elements.shell.style.setProperty('--cover-reveal', `${coverReveal}px`);
        elements.shell.style.setProperty('--closure-overhang', `${closureOverhang}px`);
        elements.shell.style.setProperty('--stack-depth', `${stackDepth}px`);
        elements.shell.style.setProperty('--shell-width', `${bookWidth + horizontalDecoration}px`);
        elements.shell.style.setProperty('--shell-height', `${pageHeight + verticalDecoration}px`);
        if (oldPresentation !== nextPresentation) buildBinding();
        renderAlbum(oldPresentation !== nextPresentation);
        fitSiteTitle();
        restartSlideshow();
      }

      function handlePointerDown(event) {
        if (
          event.target.closest('button, a, input, select, textarea') ||
          state.album.phase !== 'idle' ||
          state.album.images.length <= 1 ||
          !event.isPrimary
        ) return;
        state.album.isHeld = true;
        stopSlideshow();
        state.album.pointer = {
          id: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          time: performance.now()
        };
        elements.shell.setPointerCapture?.(event.pointerId);
      }

      function finishPointer(event, cancelled = false) {
        const pointer = state.album.pointer;
        if (!pointer || pointer.id !== event.pointerId) return;
        state.album.pointer = null;
        state.album.isHeld = false;
        try { elements.shell.releasePointerCapture?.(event.pointerId); } catch (error) { /* not captured */ }
        if (cancelled) {
          restartSlideshow();
          return;
        }

        const dx = event.clientX - pointer.x;
        const dy = event.clientY - pointer.y;
        const distance = Math.hypot(dx, dy);
        const elapsed = performance.now() - pointer.time;
        const threshold = Math.max(40, elements.shell.clientWidth * .08);
        if (Math.abs(dx) >= threshold && Math.abs(dx) >= Math.abs(dy) * 1.2) {
          changeAlbum(dx < 0 ? 1 : -1, true);
          return;
        }
        if (distance <= 8 && elapsed < 500) {
          const bounds = elements.shell.getBoundingClientRect();
          changeAlbum(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1, true);
          return;
        }
        restartSlideshow();
      }

      function isInteractiveTarget(target) {
        return Boolean(target.closest('button, input, select, textarea, a, iframe, [contenteditable="true"]'));
      }

      function safePlayerValue(method, fallback) {
        try {
          if (state.player.instance && typeof state.player.instance[method] === 'function') {
            const result = state.player.instance[method]();
            return result ?? fallback;
          }
        } catch (error) { /* the player may be temporarily unavailable */ }
        return fallback;
      }

      function syncPlayerSurfaces() {
        const restricted = state.layout.mode === 'restricted-landscape';
        const showYouTubeSurface = FEATURE_FLAGS['show-yt-iframe'] && !restricted;
        document.documentElement.classList.toggle('show-yt-iframe', FEATURE_FLAGS['show-yt-iframe']);
        elements.fullPlayer.inert = restricted;
        elements.youtubeSurface.inert = !showYouTubeSurface;
        if (restricted) elements.fullPlayer.setAttribute('aria-hidden', 'true');
        else elements.fullPlayer.removeAttribute('aria-hidden');
        if (showYouTubeSurface) elements.youtubeSurface.removeAttribute('aria-hidden');
        else elements.youtubeSurface.setAttribute('aria-hidden', 'true');

        const iframe = elements.youtubeHost.querySelector('iframe');
        if (iframe) {
          if (showYouTubeSurface) iframe.removeAttribute('tabindex');
          else iframe.tabIndex = -1;
        }
      }

      function enterRestrictedLayout() {
        if (state.layout.mode === 'restricted-landscape') return;
        state.layout.mode = 'restricted-landscape';
        elements.app.dataset.layout = state.layout.mode;
        syncPlayerSurfaces();
        updateDisc();
        sizeAlbum();
      }

      function exitRestrictedLayout() {
        if (state.layout.mode !== 'restricted-landscape') return;
        state.layout.mode = 'normal';
        elements.app.dataset.layout = state.layout.mode;
        syncPlayerSurfaces();
        sizeAlbum();
        syncPlayerSnapshot();
        updatePlayButton();
        updateDisc();
        window.requestAnimationFrame(syncTitleMarquee);
      }

      function syncLayoutMode() {
        if (compactQuery.matches) enterRestrictedLayout();
        else exitRestrictedLayout();
      }

      function showPlayerMessage(message, showLink = true) {
        elements.playerMessageText.textContent = message;
        elements.playerMessage.querySelector('a').hidden = !showLink;
        elements.playerMessage.hidden = false;
      }

      function hidePlayerMessage() {
        elements.playerMessage.hidden = true;
      }

      function setControlsEnabled(enabled) {
        [elements.previousTrack, elements.playPause, elements.nextTrack, elements.compactPlayPause]
          .forEach(control => { control.disabled = !enabled; });
      }

      function loadYouTubeAPI() {
        if (state.player.apiReady) {
          createYouTubePlayer();
          return;
        }
        if (state.player.apiRequested) {
          schedulePlayerApiTimeout();
          return;
        }
        state.player.apiRequested = true;
        state.player.lifecycle = 'loading';
        showPlayerMessage('Preparing the official YouTube player…', true);

        const previousReady = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = () => {
          if (typeof previousReady === 'function') previousReady();
          state.player.apiReady = true;
          if (state.player.apiTimeout) window.clearTimeout(state.player.apiTimeout);
          state.player.apiTimeout = null;
          createYouTubePlayer();
        };

        const script = document.createElement('script');
        script.src = 'https://www.youtube.com/iframe_api';
        script.async = true;
        script.onerror = () => failPlayer('The YouTube player could not be loaded.', 'failed');
        document.head.append(script);
        schedulePlayerApiTimeout();
      }

      function schedulePlayerApiTimeout() {
        if (state.player.apiReady || state.player.apiTimeout) return;
        state.player.apiTimeout = window.setTimeout(() => {
          state.player.apiTimeout = null;
          if (!state.player.apiReady) {
            failPlayer('The YouTube player took too long to respond.', 'timed-out');
          }
        }, 10000);
      }

      function createYouTubePlayer() {
        if (state.player.instance) return;
        if (!/^PL[A-Za-z0-9_-]{10,}$/.test(PLAYLIST.id)) {
          failPlayer('The playlist configuration is not valid.', 'failed');
          return;
        }
        if (!state.player.apiReady || !window.YT?.Player) {
          loadYouTubeAPI();
          return;
        }

        elements.youtubeHost.replaceChildren();
        const mount = document.createElement('div');
        mount.id = `youtube-player-${Date.now()}`;
        elements.youtubeHost.append(mount);
        showPlayerMessage('Connecting to YouTube…', true);
        state.player.lifecycle = 'loading';

        const playerVars = {
          autoplay: 0,
          controls: 1,
          playsinline: 1,
          loop: 1,
          listType: 'playlist',
          list: PLAYLIST.id,
          rel: 0
        };
        if (/^https?:$/.test(location.protocol)) playerVars.origin = location.origin;

        try {
          state.player.instance = new window.YT.Player(mount.id, {
            width: '200',
            height: '200',
            playerVars,
            events: {
              onReady: handlePlayerReady,
              onStateChange: handlePlayerState,
              onError: handlePlayerError,
              onAutoplayBlocked: handleAutoplayBlocked
            }
          });
        } catch (error) {
          state.player.instance = null;
          failPlayer('The YouTube player could not be created.', 'failed');
        }
      }

      function handlePlayerReady(event) {
        if (event.target !== state.player.instance) return;
        state.player.lifecycle = 'ready';
        state.player.playback = 'cued';
        setControlsEnabled(true);
        hidePlayerMessage();
        elements.playerStatus.textContent = 'Ready — press Play';
        syncPlayerSurfaces();
        syncPlayerSnapshot();
        updatePlayButton();
        updateDisc();
      }

      function playbackName(code) {
        const states = window.YT?.PlayerState;
        if (!states) return 'unstarted';
        if (code === states.PLAYING) return 'playing';
        if (code === states.PAUSED) return 'paused';
        if (code === states.BUFFERING) return 'buffering';
        if (code === states.ENDED) return 'ended';
        if (code === states.CUED) return 'cued';
        return 'unstarted';
      }

      function handlePlayerState(event) {
        if (event.target !== state.player.instance) return;
        state.player.playback = playbackName(event.data);
        syncPlayerSnapshot();
        if (state.player.playback === 'playing') {
          state.player.loopFallbackUsed = false;
          elements.playerStatus.textContent = factualTrackStatus('Playing');
          startProgressPolling();
        } else if (state.player.playback === 'buffering') {
          elements.playerStatus.textContent = factualTrackStatus('Buffering');
          stopProgressPolling();
        } else if (state.player.playback === 'paused' || state.player.playback === 'cued') {
          elements.playerStatus.textContent = factualTrackStatus('Paused');
          stopProgressPolling();
          syncPlayerSnapshot();
        } else if (state.player.playback === 'ended') {
          elements.playerStatus.textContent = 'Track ended';
          stopProgressPolling();
          if (state.player.userHasRequestedPlayback && !state.player.loopFallbackUsed) {
            state.player.loopFallbackUsed = true;
            window.setTimeout(() => {
              if (state.player.playback === 'ended' && state.player.instance) {
                try { state.player.instance.playVideoAt(0); } catch (error) { /* native loop may have taken over */ }
              }
            }, 450);
          }
        } else {
          stopProgressPolling();
        }
        updatePlayButton();
        updateDisc();
      }

      function handleAutoplayBlocked() {
        state.player.playback = 'blocked';
        elements.playerStatus.textContent = 'Playback was blocked — press Play again';
        stopProgressPolling();
        updatePlayButton();
        updateDisc();
      }

      function handlePlayerError(event) {
        const code = Number(event.data);
        state.player.lastError = code;
        stopProgressPolling();
        if ([5, 100, 101, 150].includes(code)) {
          const index = Math.max(0, safePlayerValue('getPlaylistIndex', state.player.currentPlaylistIndex));
          state.player.failedPlaylistItems.add(index);
          const length = Math.max(0, safePlayerValue('getPlaylist', []).length || state.player.playlistLength);
          if (length && state.player.failedPlaylistItems.size >= length) {
            failPlayer('No playable items are available in this playlist.', 'failed');
            return;
          }
          elements.playerStatus.textContent = 'Skipping an unavailable playlist item…';
          try { state.player.instance.nextVideo(); } catch (error) { failPlayer('The playlist is unavailable.', 'failed'); }
          return;
        }
        if ([2, 153].includes(code)) {
          failPlayer(code === 2 ? 'The playlist request is not valid.' : 'YouTube rejected this player request.', 'failed');
          return;
        }
        failPlayer('YouTube reported a playback error.', 'failed');
      }

      function failPlayer(message, lifecycle) {
        stopProgressPolling();
        state.player.lifecycle = lifecycle;
        state.player.playback = 'error';
        setControlsEnabled(false);
        elements.playerStatus.textContent = message;
        showPlayerMessage(message, true);
        updatePlayButton();
        updateDisc();
      }

      function factualTrackStatus(prefix) {
        const length = state.player.playlistLength;
        const index = state.player.currentPlaylistIndex;
        return length ? `${prefix} — Track ${index + 1} of ${length}` : prefix;
      }

      function fallbackTrackTitle() {
        const length = state.player.playlistLength;
        const index = state.player.currentPlaylistIndex;
        return length ? `Track ${Math.min(index + 1, length)} of ${length}` : 'Puja playlist';
      }

      function syncTrackTitle() {
        const videoData = safePlayerValue('getVideoData', null);
        const metadataTitle = typeof videoData?.title === 'string' ? videoData.title.trim() : '';
        state.player.currentTrackTitle = metadataTitle || fallbackTrackTitle();
        if (elements.playerTitle.textContent !== state.player.currentTrackTitle) {
          elements.playerTitle.textContent = state.player.currentTrackTitle;
          window.requestAnimationFrame(syncTitleMarquee);
        }
      }

      function syncTitleMarquee() {
        elements.playerTitle.classList.remove('is-overflowing');
        elements.playerTitle.style.removeProperty('--title-offset');
        elements.playerTitle.style.removeProperty('--title-marquee-duration');
        if (state.layout.mode !== 'normal' || state.layout.reducedMotion) return;

        const overflow = Math.ceil(elements.playerTitle.scrollWidth - elements.playerTitleViewport.clientWidth);
        if (overflow <= 1) return;
        elements.playerTitle.style.setProperty('--title-offset', `${-overflow}px`);
        const duration = Math.min(16, Math.max(7, 7 + overflow / 24));
        elements.playerTitle.style.setProperty('--title-marquee-duration', `${duration.toFixed(2)}s`);
        elements.playerTitle.classList.add('is-overflowing');
      }

      function formatTime(seconds) {
        const safe = Number.isFinite(seconds) && seconds > 0 ? Math.floor(seconds) : 0;
        const hours = Math.floor(safe / 3600);
        const minutes = Math.floor((safe % 3600) / 60);
        const remainder = safe % 60;
        return hours
          ? `${hours}:${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`
          : `${minutes}:${String(remainder).padStart(2, '0')}`;
      }

      function syncPlayerSnapshot() {
        if (!state.player.instance) return;
        const playlist = safePlayerValue('getPlaylist', []);
        state.player.currentPlaylistIndex = Math.max(0, Number(safePlayerValue('getPlaylistIndex', state.player.currentPlaylistIndex)) || 0);
        state.player.playlistLength = Array.isArray(playlist) ? playlist.length : state.player.playlistLength;
        state.player.currentSeconds = Math.max(0, Number(safePlayerValue('getCurrentTime', state.player.currentSeconds)) || 0);
        state.player.durationSeconds = Math.max(0, Number(safePlayerValue('getDuration', state.player.durationSeconds)) || 0);
        syncTrackTitle();
        elements.progress.max = Math.max(1, state.player.durationSeconds);
        elements.progress.value = Math.min(state.player.currentSeconds, Math.max(1, state.player.durationSeconds));
        elements.timeReadout.textContent = `${formatTime(state.player.currentSeconds)} / ${formatTime(state.player.durationSeconds)}`;
        if (['playing', 'paused', 'buffering'].includes(state.player.playback)) {
          const prefix = state.player.playback === 'playing' ? 'Playing' : state.player.playback === 'buffering' ? 'Buffering' : 'Paused';
          elements.playerStatus.textContent = factualTrackStatus(prefix);
        }
      }

      function startProgressPolling() {
        stopProgressPolling();
        if (!state.album.documentVisible || state.player.playback !== 'playing') return;
        syncPlayerSnapshot();
        state.player.progressTimer = window.setInterval(syncPlayerSnapshot, 1000);
      }

      function stopProgressPolling() {
        if (state.player.progressTimer) window.clearInterval(state.player.progressTimer);
        state.player.progressTimer = null;
      }

      function updatePlayButton() {
        const playing = state.player.playback === 'playing' || state.player.playback === 'buffering';
        const label = playing ? 'Pause' : 'Play';
        elements.playPause.classList.toggle('is-playing', playing);
        elements.compactPlayPause.classList.toggle('is-playing', playing);
        elements.playPause.setAttribute('aria-label', label);
        elements.compactPlayPause.setAttribute('aria-label', label);
      }

      function updateDisc() {
        const spinning = state.layout.mode === 'normal' && state.player.playback === 'playing' && !state.layout.reducedMotion;
        elements.disc.classList.toggle('is-spinning', spinning);
      }

      function togglePlayback() {
        if (!state.player.instance || state.player.lifecycle !== 'ready') return;
        const active = state.player.playback === 'playing' || state.player.playback === 'buffering';
        try {
          if (active) state.player.instance.pauseVideo();
          else {
            state.player.userHasRequestedPlayback = true;
            state.player.instance.playVideo();
          }
        } catch (error) { failPlayer('Playback controls are unavailable.', 'failed'); }
      }

      function initializeAlbum() {
        buildBinding();
        renderAlbum(true);
        state.layout.resizeObserver = new ResizeObserver(() => window.requestAnimationFrame(sizeAlbum));
        state.layout.resizeObserver.observe(elements.workspace);
        sizeAlbum();

        elements.previousPhoto.addEventListener('click', () => changeAlbum(-1, true));
        elements.nextPhoto.addEventListener('click', () => changeAlbum(1, true));
        elements.shell.addEventListener('pointerdown', handlePointerDown);
        elements.shell.addEventListener('pointerup', event => finishPointer(event));
        elements.shell.addEventListener('pointercancel', event => finishPointer(event, true));
        elements.shell.addEventListener('lostpointercapture', event => {
          if (state.album.pointer?.id === event.pointerId) finishPointer(event, true);
        });
      }

      function initializePlayerControls() {
        state.layout.playerResizeObserver = new ResizeObserver(() => window.requestAnimationFrame(syncTitleMarquee));
        state.layout.playerResizeObserver.observe(elements.playerTitleViewport);
        syncTitleMarquee();

        elements.playPause.addEventListener('click', togglePlayback);
        elements.compactPlayPause.addEventListener('click', togglePlayback);
        elements.previousTrack.addEventListener('click', () => {
          state.player.userHasRequestedPlayback = true;
          try { state.player.instance?.previousVideo(); } catch (error) { /* player event reports errors */ }
        });
        elements.nextTrack.addEventListener('click', () => {
          state.player.userHasRequestedPlayback = true;
          try { state.player.instance?.nextVideo(); } catch (error) { /* player event reports errors */ }
        });

        elements.discImage.addEventListener('error', () => {
          if (elements.discImage.dataset.fallback !== 'large') {
            elements.discImage.dataset.fallback = 'large';
            elements.discImage.src = 'resources/bikl-large.png';
          } else {
            elements.discImage.remove();
            elements.disc.classList.add('css-fallback');
          }
        });
      }

      document.addEventListener('keydown', event => {
        if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || isInteractiveTarget(event.target)) return;
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          changeAlbum(-1, true);
        } else if (event.key === 'ArrowRight') {
          event.preventDefault();
          changeAlbum(1, true);
        } else if ((event.key === ' ' || event.code === 'Space') && state.layout.mode === 'normal') {
          event.preventDefault();
          togglePlayback();
        }
      });

      document.addEventListener('visibilitychange', () => {
        state.album.documentVisible = !document.hidden;
        elements.scenery.classList.toggle('is-paused', document.hidden);
        if (document.hidden) {
          stopSlideshow();
          stopProgressPolling();
        } else {
          restartSlideshow();
          if (state.player.playback === 'playing') startProgressPolling();
        }
      });

      compactQuery.addEventListener?.('change', syncLayoutMode);
      reducedMotionQuery.addEventListener?.('change', event => {
        state.layout.reducedMotion = event.matches;
        updateDisc();
        syncTitleMarquee();
      });
      window.addEventListener('orientationchange', () => window.requestAnimationFrame(syncLayoutMode));

      initializeAlbum();
      elements.scenery.classList.toggle('is-paused', document.hidden);
      document.fonts?.ready.then(() => window.requestAnimationFrame(sizeAlbum));
      initializePlayerControls();
      elements.app.dataset.layout = state.layout.mode;
      syncPlayerSurfaces();
      loadYouTubeAPI();
      restartSlideshow();
    })();
  </script>
</body>
</html>
