---
layout: default
---

<article class="post">
  <header class="article-header">
    <a class="back-link" href="{{ site.baseurl }}/blogs/">&#8592; All blogs</a>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time>
  </header>

  <div class="entry">
    {{ content }}
  </div>

  {% include disqus.html %}
</article>
