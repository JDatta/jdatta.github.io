<!doctype html>
<html lang="en">
  <head>
    <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.name }}</title>
    {% include meta.html %}
    <script src="{{ site.baseurl }}/resources/theme.js"></script>
    <link rel="preload" href="{{ site.baseurl }}/resources/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ site.baseurl }}/resources/fonts/InterVariable-Italic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ site.baseurl }}/blog/style.css">
    <link rel="alternate" type="application/atom+xml" title="{{ site.name }} — {{ site.description }}" href="{{ site.baseurl }}/blogs/feed.xml">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="site-shell">
      <header class="site-header">
        <a class="site-title" href="{{ site.baseurl }}/">{{ site.name }}</a>

        <div class="social-links" aria-label="Social profiles">
          <a href="https://www.linkedin.com/in/joydipdatta/" aria-label="LinkedIn">
            <img src="{{ site.baseurl }}/resources/linked-in.svg" alt="" width="24" height="24">
          </a>
          <a href="https://www.instagram.com/joydipdatta/" aria-label="Instagram">
            <img src="{{ site.baseurl }}/resources/instagram.svg" alt="" width="24" height="24">
          </a>
          <a href="https://x.com/djoydip" aria-label="X">
            <img src="{{ site.baseurl }}/resources/x-logo.svg" alt="" width="24" height="24">
          </a>
          <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.64 15.35A8.5 8.5 0 0 1 8.65 3.36 8.5 8.5 0 1 0 20.64 15.35Z"></path></svg>
          </button>
        </div>
      </header>

      <nav class="site-nav" aria-label="Primary navigation">
        <a{% if page.nav == "home" %} class="active" aria-current="page"{% endif %} href="{{ site.baseurl }}/">Home</a>
        <a{% if page.nav == "blogs" or page.layout == "post" %} class="active" aria-current="page"{% endif %} href="{{ site.baseurl }}/blogs/">Blogs</a>
        <a{% if page.nav == "about" %} class="active" aria-current="page"{% endif %} href="{{ site.baseurl }}/about/">About</a>
      </nav>

      <main id="main" class="site-main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <!-- Footer content intentionally left blank. -->
      </footer>
    </div>

    {% include analytics.html %}
  </body>
</html>
